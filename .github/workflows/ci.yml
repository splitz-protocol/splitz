name: ci

on:
  push:
  pull_request:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: dart
      - run: dart analyze
        working-directory: dart
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: dart
      - run: dart test
        working-directory: dart
      # `dart analyze` type-checks the samples; it does not call them. A
      # sample that only compiles proves the names exist, not that the calls
      # in it are ones a caller may make in that order with those values.
      - run: tools/examples/run.sh

  host:
    # The plumbing a wallet needs around the protocol: the seam, signing,
    # sealing, the log, the sync, the store. Pure Dart, no Flutter, so it runs
    # on the Dart SDK alone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: splitz_host
      - run: dart analyze
        working-directory: splitz_host
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: splitz_host
      - run: dart test
        working-directory: splitz_host

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt -- --check
        working-directory: rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: rust
      - run: cargo test
        working-directory: rust
      # Both profiles: "the two implementations agree" means nothing at a
      # numeric boundary unless the overflow-checked and unchecked builds
      # both run.
      - run: cargo test --release
        working-directory: rust

  differential:
    # The corpus is generated from one reference, so it cannot hold a case
    # that reference is self-consistently wrong about. This lane invents
    # inputs nobody wrote an expectation for and diffs the answers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: dtolnay/rust-toolchain@stable
      - run: dart pub get
        working-directory: dart
      # A generator that quietly narrowed would make every run print
      # "agreement" and mean nothing by it.
      - run: python3 tools/differential/test_generate.py
      - run: tools/differential/run.sh 1 1200
      - run: tools/differential/run.sh 2 1200
      - run: tools/differential/run.sh 3 1200
      - run: tools/differential/run.sh 4 1200
      - run: tools/differential/run.sh 5 1200
      - run: tools/differential/run.sh 6 1200
      - run: tools/differential/run.sh 7 1200

  host-differential:
    # Nothing in `vectors/` can reach the host layer: a vector carries no
    # private key, so no case covers a curve operation, a derived identity or
    # a key a wallet was handed from outside. This generates the inputs and
    # asks both host implementations, which is the only check that notices one
    # of them being quietly wrong on its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: dtolnay/rust-toolchain@stable
      - run: dart pub get
        working-directory: splitz_host
      - run: tools/differential/host.sh 1 1200
      - run: tools/differential/host.sh 2 1200
      - run: tools/differential/host.sh 3 1200

  bindings:
    # A binding that compiles is not a binding that carries a callback. This
    # builds the foreign library, generates Kotlin from it, and runs a wallet
    # written against that Kotlin alone: it implements all seven of §15's
    # interfaces and drives one bill across two devices — opened, shared by
    # invite, split, priced, settled, confirmed — calling back into Kotlin for
    # storage, secrets, the clock, randomness, the relay and the send.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: tools/ffi/kotlin.sh

  bindings-dart:
    # The Dart Zcash wallets are the ones that need this. The published Dart
    # generator does not implement uniffi's callback ABI, so a binding with
    # callback interfaces compiles and then calls the wrong method; this crate
    # has none, and its output is correct unpatched.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: dtolnay/rust-toolchain@stable
      - run: tools/ffi/dart.sh

  bindings-node:
    # A third language over the same foreign library, with no static types to
    # lean on. It implements all seven of §15's interfaces and drives one bill
    # to a confirmed payment. The generator is third-party and pinned; so is
    # the uniffi version, because every generator outside the uniffi tree
    # targets 0.31.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: tools/ffi/node.sh

  spec:
    # The corpus checks values, the differential lane checks that three
    # implementations answer alike, and the parity lane checks the two public
    # surfaces. None of them reads SPEC.md, so a sentence there is the one
    # claim in this repository nothing verifies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/spec/claims.py

  oracle:
    # Every other lane compares implementations written from one
    # specification by one author; they can agree and be wrong together.
    # rust/splitz-core/tests/oracle.rs checks ZIP 321 rendering against librustzcash;
    # this checks §9.3's instants against CPython's own RFC 3339 reader.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/oracle/instants.py

  parity:
    # An API one implementation has and the other does not never reaches the
    # wire, so neither the corpus nor the differential lane can see it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/parity/surface.py

  web-target:
    # Asserts the package still refuses to compile to JavaScript. A JS number
    # is exact only to 2^53-1; this library's amounts are 64-bit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: dart
      - run: tools/web-target/run.sh

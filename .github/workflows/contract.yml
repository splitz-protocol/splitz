name: contract

# The swap client against the live 1Click API, and the price sources against
# the live CoinGecko, Coinbase and Binance answers, once a day and on demand.
#
# Everything in ci.yml runs offline, against the provider's schema and answers
# pinned in tools/contracts/. This is what notices when the provider moves:
# the schema is fetched and compared with the pinned copy, and the client's
# own request is sent with `dry: true` — nothing else changed — so it moves
# nothing and issues no deposit address. A red run means re-pin with
# tools/contracts/oneclick.py and fix what the contract tests then say.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  oneclick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # The schema is YAML; Ruby's standard library reads it (oneclick.py).
      - run: ruby --version
      - run: python3 tools/contracts/oneclick.py --check
      - run: dart pub get
        working-directory: splitz_host
      - run: dart run tool/oneclick_live.dart check
        working-directory: splitz_host

  # The price source against the live CoinGecko answer: the same reading the
  # host packages do, applied to what the service says now. A red run means
  # re-capture tools/contracts/fixtures/coingecko_price.json, regenerate the
  # cases with tools/contracts/coingecko.py, and fix what the tests then say.
  #
  # COINGECKO_API_KEY, a repository secret, is sent as the demo key when set.
  coingecko:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/contracts/coingecko.py --check
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

  # The two fallback price sources, the same way. A red run means re-capture
  # with `--capture`, which also regenerates the cases, and fix what the tests
  # then say.
  coinbase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/contracts/coinbase.py --check

  binance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/contracts/binance.py --check
